user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Restore Real Client IP from Cloudflare
    include       /etc/nginx/cloudflare.conf;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Client limits & buffers
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Logging format (captures real client IP restored by Cloudflare module)
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"cf_ray":"$http_cf_ray",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # WebSocket Upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Respect upstream protocol passed from Cloudflare
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Upstream Microservice Definitions
    upstream auth_upstream {
        server auth-service:3000;
        keepalive 32;
    }

    upstream ai_upstream {
        server ai-service:8000;
        keepalive 32;
    }

    upstream blog_upstream {
        server blog-service:4000;
        keepalive 32;
    }

    # Primary Reverse Proxy Server (Listens on both HTTP 80 and HTTPS 443)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name api.gitrabbit.co 3.110.66.16 localhost _;

        # SSL Configuration (Works with Cloudflare Origin CA, Let's Encrypt, or Self-Signed)
        ssl_certificate /etc/ssl/gitrabbit/fullchain.pem;
        ssl_certificate_key /etc/ssl/gitrabbit/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Gateway Health Probe Endpoint
        location /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"api-gateway","domain":"api.gitrabbit.co","client_ip":"$remote_addr","proto":"$forwarded_proto"}\n';
        }

        # Auth Service REST API
        location /api/auth/ {
            proxy_pass http://auth_upstream/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        # Realtime WebSocket (Socket.io terminating in Auth Service)
        location /socket.io/ {
            proxy_pass http://auth_upstream/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # AI / LLM Service
        location /api/ai/ {
            proxy_pass http://ai_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Blog Service
        location /api/blog/ {
            proxy_pass http://blog_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Default fallback
        location / {
            default_type application/json;
            return 200 '{"message":"GitRabbit API Gateway v2.0","domain":"api.gitrabbit.co","health":"/healthz"}\n';
        }
    }
}
