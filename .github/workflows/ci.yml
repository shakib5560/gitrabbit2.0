name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Quality, Linting & Type Checking
  # ----------------------------------------------------------------------------
  quality-gate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/auth/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-service/requirements.txt

      # Auth Service
      - name: Install Auth Service Dependencies
        working-directory: services/auth
        run: npm ci

      - name: Generate Auth Prisma Client
        working-directory: services/auth
        run: npx prisma generate

      - name: Lint Auth Service
        working-directory: services/auth
        run: npm run lint

      - name: Typecheck & Build Auth Service
        working-directory: services/auth
        run: npm run build

      # Blog Service
      - name: Install Blog Service Dependencies
        working-directory: services/blog-service
        run: npm ci

      - name: Generate Blog Prisma Client
        working-directory: services/blog-service
        run: npx prisma generate

      - name: Typecheck & Build Blog Service
        working-directory: services/blog-service
        run: npm run build

      # AI Service
      - name: Install AI Service Dependencies
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify AI Service Python Syntax
        working-directory: services/ai-service
        run: python3 -m py_compile app/main.py

  # ----------------------------------------------------------------------------
  # Job 2: Integration & E2E Testing Gate
  # ----------------------------------------------------------------------------
  test-gate:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/auth/package-lock.json

      - name: Install Auth Dependencies
        working-directory: services/auth
        run: npm ci

      - name: Generate Prisma Client & Migrate Test DB
        working-directory: services/auth
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Run Auth E2E Tests
        working-directory: services/auth
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_super_secret_jwt_key_1234567890' }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci_test_super_secret_jwt_key_1234567890' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_test_super_secret_refresh_jwt_key_1234567890' }}
          REDIS_URL: redis://localhost:6379
          PORT: 3000
        run: npm run test:e2e

  # ----------------------------------------------------------------------------
  # Job 3: Docker Build Validation & Security Scan
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test-gate]
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service Image (BuildKit Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth
          file: ./services/auth/Dockerfile
          push: false
          load: true
          tags: gitrabbit-auth:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: false
          load: true
          tags: gitrabbit-gateway:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Gateway Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gitrabbit-gateway:ci-test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
