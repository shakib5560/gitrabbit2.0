name: CI/CD Pipeline - AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ─── 1. Quality & Test Gate ───
  test:
    name: Build & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/auth/package-lock.json

      - name: Install Auth Service Dependencies
        working-directory: services/auth
        run: npm ci

      - name: Generate Prisma Client
        working-directory: services/auth
        run: npx prisma generate

      - name: Build Auth Service
        working-directory: services/auth
        run: npm run build

      - name: Run E2E Integration Tests (Auth, WebSocket, Redis)
        working-directory: services/auth
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_TlWU8wncKaF4@ep-young-rain-b59pxssb-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'zV8adrd31EFoqU6O2f3R24qYQGamxvMWIzSYwrJ4nSe' }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'zV8adrd31EFoqU6O2f3R24qYQGamxvMWIzSYwrJ4nSe' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'vv28495Plf2yFXBt9XiPYuC2KI7o5SokPS1qceFFqbr' }}
          REDIS_URL: redis://localhost:6379
          PORT: 3000
        run: npm run test:e2e

  # ─── 2. Continuous Deployment to AWS EC2 ───
  deploy:
    name: Deploy to AWS EC2 (Docker)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: SSH into EC2 and Trigger Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            echo "=========================================================="
            echo "🚀 Starting Automated Deployment on AWS EC2..."
            echo "=========================================================="
            
            # Navigate to project directory (or clone if first time)
            TARGET_DIR="$HOME/gitrabbit2.0"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/shakib5560/gitrabbit2.0.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"

            echo "📦 Fetching latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Ensuring permissions on deployment scripts..."
            chmod +x scripts/*.sh 2>/dev/null || true

            echo "🐳 Running Zero-Downtime Deployment..."
            if [ -f "scripts/deploy.sh" ]; then
              ./scripts/deploy.sh
            else
              docker compose up -d --build --remove-orphans
              docker image prune -f
            fi

            echo "=========================================================="
            echo "✅ Deployment Successfully Completed!"
            echo "=========================================================="
